name: auth_service
services:
  auth_service_postgres:
    image: postgres:17.6-alpine3.21
    container_name: auth_service_postgres
    ports:
      - '${DB_SERVER_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword}
      POSTGRES_DB: ${DB_DATABASE:-article-newsletter-auth}
    volumes:
      - article-newsletter-auth-service-postgres-data:/var/lib/postgresql/data

  auth_service_redis:
    image: redis:7.4-alpine3.21
    container_name: auth_service_redis
    environment:
      REDIS_HOST: ${REDIS_HOST:-auth_service_redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-strongpassword}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - '${REDIS_SERVER_PORT:-6379}:6379'
    volumes:
      - article-newsletter-auth-service-redis-data:/data

  auth_service_api:
    build:
      context: ../
      dockerfile: docker/app/Dockerfile
    container_name: auth_service_api
    depends_on:
      - auth_service_postgres
      - auth_service_redis
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - ../src:/app/src
    restart: always

  auth_service_prisma_migration:
    build:
      context: ../
      dockerfile: docker/prisma/Dockerfile
    container_name: auth_service_prisma_migration
    environment:
      DATABASE_URL: ${DATABASE_URL-postgresql://admin:strongpassword@auth_service_postgres:5432/article-newsletter-auth}
    depends_on:
      - auth_service_postgres
    volumes:
      - ../prisma:/app/prisma
    restart: never

volumes:
  article-newsletter-auth-service-postgres-data:
  article-newsletter-auth-service-redis-data:

networks:
  article_newsletter_project_net:
    external: true
